<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Retocker Manager</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="style.css">
</head><body>
<div class="win">
  <div class="tbar">
    <div class="drag" data-tauri-drag-region><img src="icons/manager.svg" alt=""><span data-tauri-drag-region>Retocker Manager</span></div>
    <button class="wb" data-w="min" title="Свернуть"><svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg></button>
    <button class="wb x" data-w="close" title="Закрыть"><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
  </div>
  <div class="scroll">
    <div class="page">
      <header class="ph">
        <div><h1>Программы</h1><p id="sum"></p></div>
        <div class="btns">
          <button class="btn" id="bCheck"><svg viewBox="0 0 16 16"><path d="M13.3 8a5.3 5.3 0 1 1-1.6-3.8M13.4 2.6v2.9h-2.9"/></svg>Проверить</button>
          <button class="btn pri" id="bAll" hidden>Обновить все</button>
        </div>
      </header>
      <div class="self" id="self"><div><div class="selfin">
        <svg viewBox="0 0 16 16"><path d="M8 2.5v7.2M4.9 6.8 8 9.9l3.1-3.1M3 13.2h10"/></svg>
        <div class="tx"><b id="selfT"></b><small id="selfN"></small><div class="pbar" id="selfBar" hidden><b></b></div></div>
        <button class="btn pri" id="selfGo">Обновить</button>
      </div></div></div>
      <div class="list" id="list"></div>
      <footer class="pfoot"><span>Retocker Manager <b id="ver"></b></span><span class="sp"></span><button class="lnk" id="bLogs" title="Папка с журналом работы — пригодится, если что-то пошло не так">Журнал</button></footer>
    </div>
  </div>
</div>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="shared.js"></script><script src="app.js"></script>
</body></html>
